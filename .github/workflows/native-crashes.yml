name: native crashes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ios:
    name: crashes native (ios)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Compile and run real Swift parser/store; typecheck real iOS adapter
        run: bash packages/telltale-crashes/tests/native/run-swift.sh
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer -d packages/telltale-client install --no-interaction --prefer-dist
      - run: composer -d packages/telltale-crashes install --no-interaction --prefer-dist
      - name: Verify merged privacy manifest in a built synchronized-folder iOS fixture
        run: bash packages/telltale-crashes/tests/native/verify-privacy-resource.sh
      - name: Import generated iOS reports through actual PHP outbox and encoded v2 envelope
        working-directory: packages/telltale-client
        run: vendor/bin/pest tests/NativeProjectionTest.php --filter=ios

  android:
    name: crashes native (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
      - name: Install compile SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"'
      - name: Compile actual Android sources with real SDK; run pure JVM store/decoder/handler harness
        run: gradle -p packages/telltale-crashes/tests/native/android-build run --no-daemon
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer -d packages/telltale-client install --no-interaction --prefer-dist
      - name: Import generated protobuf projection through actual PHP outbox and encoded v2 envelope
        working-directory: packages/telltale-client
        run: vendor/bin/pest tests/NativeProjectionTest.php --filter=android
