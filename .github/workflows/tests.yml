name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  server:
    name: server (8.5)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_DB: telltale_app_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install root dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install contracts dependencies
        run: composer -d packages/telltale-contracts install --no-interaction --prefer-dist

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Rector
        run: composer rector:check

      - name: Run PHPStan
        run: composer stan

      - name: Run contracts static analysis
        run: composer -d packages/telltale-contracts stan

      - name: Run root tests
        run: ./vendor/bin/pest

      - name: Run contracts tests
        run: composer -d packages/telltale-contracts test

      - name: Audit dependencies
        run: |
          composer audit --abandoned=report
          composer -d packages/telltale-contracts audit --abandoned=report

  client:
    name: client (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Install client dependencies
        run: composer -d packages/telltale-client install --no-interaction --prefer-dist

      - name: Run client static analysis
        run: composer -d packages/telltale-client stan

      - name: Run client tests
        run: composer -d packages/telltale-client test

      - name: Audit client dependencies
        run: composer -d packages/telltale-client audit --abandoned=report
